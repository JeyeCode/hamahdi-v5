  <!-- Splash Screen مطابق تم تاریک-طلایی هم‌عهدی -->

      </div>

        <div class="w-full h-2 bg-slate-900/90 rounded-full overflow-hidden border border-white/15 p-0.5">
          <div id="app-splash-progress" class="h-full bg-gradient-to-r from-amber-400 via-emerald-400 to-cyan-400 rounded-full transition-all duration-75 ease-out" style="width: 0%;"></div>
        </div>
        <div class="flex items-center justify-between text-[11px] text-slate-300 font-bold px-1">
          <span class="text-emerald-400 font-medium">بارگذاری عهد بازار و عهدبات...</span>
          <span id="app-splash-pct" class="font-mono text-amber-300 dir-ltr">۰٪</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      try {
        // تم پیش‌فرض نسخه ۵ موبایل: تم تاریک-طلایی مطابق تصویر
        var savedTheme = localStorage.getItem('hamahdi_theme_mode');
        if (savedTheme === 'light') {
          document.body.classList.add('light-theme');
        } else {
          document.body.classList.remove('light-theme');
        }
        var ensureAppCssLast = function() {
          var appLink = document.querySelector('link[href*="v5_theme_polish.css"]') || document.querySelector('link[href*="assets/css/app.css"]');
          if (appLink && appLink.parentNode && appLink.nextElementSibling) {
            appLink.parentNode.appendChild(appLink);
          }
        };
        window.addEventListener('DOMContentLoaded', ensureAppCssLast);
        setTimeout(ensureAppCssLast, 150);
      } catch (e) {}

      var startTs = Date.now();
      var targetDuration = 600;
      var pBar = document.getElementById('app-splash-progress');
      var pTxt = document.getElementById('app-splash-pct');
      var splash = document.getElementById('app-splash-screen');

      var timer = setInterval(function() {
        var elapsed = Date.now() - startTs;
        var pct = Math.min(100, Math.floor((elapsed / targetDuration) * 100));
        if (pBar) pBar.style.width = pct + '%';
        if (pTxt) pTxt.textContent = pct + '%';
        if (pct >= 100) {
          clearInterval(timer);
          if (splash) {
            splash.style.transition = 'opacity 0.45s ease';
            splash.style.opacity = '0';
            setTimeout(function() {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 460);
          }
        }
      }, 25);

      window.__dismissSplashEarly = function() {
        if (pBar) pBar.style.width = '100%';
        if (pTxt) pTxt.textContent = '۱۰۰٪';
        clearInterval(timer);
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(function() { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 300);
        }
      };
    })();
  </script>
