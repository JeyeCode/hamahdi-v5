name: Build Ham-Ahdi v5 Final APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout Ham-Ahdi v5
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor Dependencies
        run: npm install

      - name: Initialize & Sync Capacitor Android Platform
        run: |
          if [ ! -f android/gradlew ]; then
            mv android android_custom_backup
            npx cap add android
            cp -f android_custom_backup/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            cp -rf android_custom_backup/app/src/main/res/* android/app/src/main/res/
            cp -f android_custom_backup/app/src/main/java/ir/hamahdi/app/MainActivity.java android/app/src/main/java/ir/hamahdi/app/MainActivity.java
            rm -rf android_custom_backup
          fi
          npx cap sync android

      - name: Build Debug & Release APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease
          mkdir -p ../dist_apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist_apk/hamahdi-v5-debug.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            keytool -genkey -v -keystore /tmp/hamahdi-release.keystore -alias hamahdi -keyalg RSA -keysize 2048 -validity 10000 -storepass hamahdi2026 -keypass hamahdi2026 -dname "CN=HamAhdi, OU=Mobile, O=HamAhdi, L=Mashhad, ST=Khorasan, C=IR"
            BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
            "${BUILD_TOOLS}/zipalign" -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/hamahdi-aligned.apk
            "${BUILD_TOOLS}/apksigner" sign --ks /tmp/hamahdi-release.keystore --ks-pass pass:hamahdi2026 --key-pass pass:hamahdi2026 --out ../dist_apk/hamahdi-v5-release-signed.apk /tmp/hamahdi-aligned.apk
          fi
          ls -lh ../dist_apk/

      - name: Upload Final APK Files
        uses: actions/upload-artifact@v4
        with:
          name: hamahdi-v5-final-apk
          path: android_app/dist_apk/*.apk
